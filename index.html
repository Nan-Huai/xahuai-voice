<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声音博物馆 · 小羊</title>
<meta name="description" content="48 段原声。她声音最初的样子。">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
<style>
  :root{
    --bg:#0b0b0d;
    --card:rgba(255,255,255,.038);
    --line:rgba(255,255,255,.085);
    --line-strong:rgba(255,255,255,.17);
    --ink:#ecedf1;
    --dim:rgba(236,237,241,.7);
    --muted:#7f7f8b;
    --accent:#c9b6ff;
    --accent-soft:rgba(201,182,255,.13);
    --warm:#ffd7a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

  body{
    min-height:100dvh;
    background:
      radial-gradient(110% 70% at 50% -8%, rgba(140,120,220,.11), transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:-30% -20% auto -20%;height:80vh;
    background:radial-gradient(46% 46% at 50% 40%, rgba(160,140,255,.13), transparent 72%);
    pointer-events:none;z-index:0;animation:breathe 16s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){body::before{animation:none;opacity:.55}}

  .wrap{position:relative;z-index:1;width:100%;max-width:620px;margin:0 auto;padding:clamp(40px,10vh,90px) 18px 80px}

  /* 头部 */
  .hero{text-align:center;margin-bottom:34px}
  .hero .mark{
    font-size:clamp(30px,8.5vw,42px);font-weight:600;letter-spacing:.04em;
    background:linear-gradient(180deg,#fff,#b9b3d6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{margin-top:10px;color:var(--muted);font-size:12.5px;letter-spacing:.24em;text-indent:.24em}
  .hero .stats{
    display:flex;justify-content:center;gap:22px;margin-top:22px;
    font-size:12px;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap;
  }
  .hero .stats b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  /* 工具条 */
  .toolbar{
    position:sticky;top:0;z-index:20;
    margin:0 -18px 18px;padding:12px 18px;
    background:rgba(11,11,13,.82);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .toolbar .all{
    flex:none;display:flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--dim);
    border:1px solid var(--line-strong);border-radius:999px;
    padding:7px 14px;cursor:pointer;background:transparent;
    transition:all .25s;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:inherit;
  }
  .toolbar .all:hover{border-color:rgba(201,182,255,.5);color:var(--ink)}
  .toolbar .all.on{background:var(--accent-soft);border-color:rgba(201,182,255,.55);color:var(--accent)}
  .toolbar .all svg{width:11px;height:11px;fill:currentColor}
  .toolbar .progress{
    flex:1;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;
  }
  .toolbar .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .toolbar .count{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}

  /* 月份分组 */
  .month{margin-bottom:26px}
  .month-h{
    display:flex;align-items:center;gap:11px;
    margin:0 0 11px;padding-left:2px;
  }
  .month-h .t{font-size:12px;color:var(--muted);letter-spacing:.2em;white-space:nowrap}
  .month-h .n{font-size:11px;color:rgba(127,127,139,.75);font-variant-numeric:tabular-nums}
  .month-h .l{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* 语音条目 */
  .v{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;margin-bottom:7px;
    border:1px solid var(--line);border-radius:14px;
    background:var(--card);
    cursor:pointer;transition:border-color .25s,background .25s;
    user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .v:hover{border-color:var(--line-strong);background:rgba(255,255,255,.055)}
  .v.playing{border-color:rgba(201,182,255,.45);background:var(--accent-soft)}
  .v.done{border-color:rgba(255,255,255,.055)}
  .v.done .idx{color:rgba(201,182,255,.5)}

  .v .idx{
    flex:none;width:22px;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:right;
  }
  .v .btn{
    flex:none;width:31px;height:31px;border-radius:50%;
    border:1px solid var(--line-strong);display:grid;place-items:center;
    transition:all .25s;
  }
  .v:hover .btn{border-color:rgba(201,182,255,.5)}
  .v.playing .btn{border-color:var(--accent);background:rgba(201,182,255,.2)}
  .v .btn svg{width:11px;height:11px;fill:var(--dim)}
  .v.playing .btn svg{fill:var(--accent)}

  .v .bar{flex:none;width:34px;height:15px;display:flex;align-items:flex-end;gap:2px;opacity:.22;transition:opacity .25s}
  .v.playing .bar{opacity:1}
  .v .bar span{flex:1;background:var(--accent);border-radius:1px;height:25%;transition:height .16s}
  .v.playing .bar span{animation:w .9s ease-in-out infinite}
  .v.playing .bar span:nth-child(2){animation-delay:.1s}
  .v.playing .bar span:nth-child(3){animation-delay:.2s}
  .v.playing .bar span:nth-child(4){animation-delay:.3s}
  @keyframes w{0%,100%{height:22%}50%{height:100%}}
  @media (prefers-reduced-motion:reduce){.v.playing .bar span{animation:none;height:55%}}

  .v .meta{flex:1;min-width:0}
  .v .time{font-size:13.5px;color:var(--ink);letter-spacing:.02em}
  .v .time .hm{color:var(--muted);font-size:12px;margin-left:7px;font-variant-numeric:tabular-nums}
  .v .nm{font-size:11.5px;color:var(--accent);margin-top:1px;letter-spacing:.04em}
  .v .dur{flex:none;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.03em}

  /* 底部 */
  .foot{
    margin-top:36px;text-align:center;color:var(--muted);
    font-size:12px;letter-spacing:.1em;line-height:2.2;opacity:.75;
  }
  .foot a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.16)}
  .foot a:hover{border-bottom-color:var(--accent)}

  .fade{opacity:0;transform:translateY(10px);animation:in .7s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;animation:none}}

  /* 底部播放器 */
  .dock{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
    width:100%;max-width:620px;z-index:50;
    background:rgba(14,14,17,.94);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line-strong);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    transition:transform .34s cubic-bezier(.2,.7,.3,1);
  }
  .dock.up{transform:translate(-50%,0)}
  .dock .row{display:flex;align-items:center;gap:12px}
  .dock .cc{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;cursor:pointer;background:transparent}
  .dock .cc svg{width:10px;height:10px;fill:var(--dim)}
  .dock .info{flex:1;min-width:0}
  .dock .info .a{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock .info .b{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
  .dock .seek{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;margin-top:4px}
  .dock .seek .track{width:100%;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  .dock .seek .fill{height:100%;width:0;background:var(--accent)}
  .dock .close{flex:none;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;opacity:.5;background:transparent;border:none}
  .dock .close:hover{opacity:1}
  .dock .close svg{width:10px;height:10px;stroke:var(--ink);fill:none;stroke-width:2}

  @media (max-width:360px){
    .v .bar{display:none}
    .hero .stats{gap:14px;font-size:11.5px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero fade">
    <div class="mark">声音博物馆</div>
    <div class="sub">她最初的样子</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <button class="all" id="playAll">
      <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72L19 12z"/></svg>
      <span>全部播放</span>
    </button>
    <div class="progress"><i id="pg"></i></div>
    <div class="count" id="count">0 / 48</div>
  </div>

  <div id="list"></div>

  <div class="foot">
    48 段原声 · 全部来自微信语音<br>
    <a href="https://xahuai.icu">← 回到小羊</a>
  </div>

</div>

<div class="dock" id="dock">
  <div class="row">
    <button class="cc" id="dockBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5.14v13.72L19 12z"/></svg>
    </button>
    <div class="info">
      <div class="a" id="dockName">—</div>
      <div class="b" id="dockTime">0:00 / 0:00</div>
    </div>
    <button class="close" id="dockClose">
      <svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg>
    </button>
  </div>
  <div class="seek" id="seek"><div class="track"><div class="fill" id="fill"></div></div></div>
</div>

<script>
(function(){
  var DATA = null;
  var audio = new Audio();
  audio.preload = 'none';

  var curIdx = -1;        // 当前播放索引
  var curEl = null;       // 当前 DOM
  var playingAll = false;
  var playedSet = new Set();

  var dock = document.getElementById('dock');
  var dockBtn = document.getElementById('dockBtn');
  var dockName = document.getElementById('dockName');
  var dockTime = document.getElementById('dockTime');
  var fill = document.getElementById('fill');
  var seek = document.getElementById('seek');
  var pg = document.getElementById('pg');
  var countEl = document.getElementById('count');
  var playAllBtn = document.getElementById('playAll');

  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var ss = Math.floor(s % 60);
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function updateCount(){
    countEl.textContent = playedSet.size + ' / ' + DATA.length;
    pg.style.width = (playedSet.size / DATA.length * 100) + '%';
  }

  function render(){
    var list = document.getElementById('list');
    var html = '';
    var curYM = '';
    var monthCount = {};
    DATA.forEach(function(x){ monthCount[x.ym] = (monthCount[x.ym] || 0) + 1; });
    var seen = {};

    DATA.forEach(function(x, i){
      if (x.ym !== curYM){
        if (curYM) html += '</div>';
        curYM = x.ym;
        var y = x.ym.slice(0,4), m = parseInt(x.ym.slice(5,7), 10);
        html += '<div class="month"><div class="month-h">'
             +  '<span class="t">' + y + ' 年 ' + m + ' 月</span>'
             +  '<span class="n">' + monthCount[x.ym] + ' 段</span>'
             +  '<span class="l"></span></div>';
      }
      html += '<div class="v" data-i="' + i + '">'
           +   '<div class="idx">' + x.i + '</div>'
           +   '<div class="btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v13.72L19 12z"/></svg></div>'
           +   '<div class="bar"><span></span><span></span><span></span><span></span></div>'
           +   '<div class="meta">'
           +     '<div class="time">' + x.md + '<span class="hm">' + x.hm + '</span></div>'
           +     (x.n ? '<div class="nm">' + x.n + '</div>' : '')
           +   '</div>'
           +   '<div class="dur">' + x.d.toFixed(1) + '″</div>'
           + '</div>';
    });
    html += '</div>';
    list.innerHTML = html;

    // 统计
    var tot = DATA.reduce(function(a,b){ return a + b.d; }, 0);
    document.getElementById('stats').innerHTML =
      '<span><b>' + DATA.length + '</b> 段</span>'
    + '<span><b>' + fmt(tot) + '</b> 总长</span>'
    + '<span><b>' + DATA[0].ym.replace('-','.') + '</b> — <b>' + DATA[DATA.length-1].ym.replace('-','.') + '</b></span>';

    // 绑定
    list.querySelectorAll('.v').forEach(function(el){
      el.addEventListener('click', function(){
        var i = parseInt(el.getAttribute('data-i'), 10);
        if (curIdx === i && !audio.paused){
          audio.pause();
        } else {
          playAt(i);
        }
      });
    });

    updateCount();
  }

  function markEl(el, on){
    if (!el) return;
    el.classList.toggle('playing', on);
    var svg = el.querySelector('.btn svg');
    if (on) svg.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    else svg.innerHTML = '<path d="M8 5.14v13.72L19 12z"/>';
  }

  function markDock(on){
    var svg = dockBtn.querySelector('svg');
    if (on) svg.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    else svg.innerHTML = '<path d="M8 5.14v13.72L19 12z"/>';
  }

  function playAt(i){
    if (i >= DATA.length){ stopAll(); return; }
    var x = DATA[i];

    if (curEl) markEl(curEl, false);

    curIdx = i;
    curEl = document.querySelector('.v[data-i="' + i + '"]');
    markEl(curEl, true);

    audio.src = 'audio/' + x.f;
    audio.play().catch(function(){ markEl(curEl, false); });

    dockName.textContent = x.md + ' ' + x.hm + (x.n ? ' · ' + x.n : '');
    dock.classList.add('up');
    markDock(true);

    // 滚动到可见
    if (curEl && !playingAll){
      var r = curEl.getBoundingClientRect();
      if (r.top < 80 || r.bottom > window.innerHeight - 100){
        curEl.scrollIntoView({block:'center', behavior:'smooth'});
      }
    }
  }

  function stopAll(){
    playingAll = false;
    playAllBtn.classList.remove('on');
    playAllBtn.querySelector('span').textContent = '全部播放';
    playAllBtn.querySelector('svg').innerHTML = '<path d="M8 5.14v13.72L19 12z"/>';
  }

  // 播放完一条
  audio.addEventListener('ended', function(){
    if (curEl) curEl.classList.add('done');
    if (curIdx >= 0) playedSet.add(curIdx);
    updateCount();

    if (playingAll && curIdx < DATA.length - 1){
      playAt(curIdx + 1);
    } else {
      if (curEl) markEl(curEl, false);
      markDock(false);
      if (playingAll) stopAll();
    }
  });

  audio.addEventListener('error', function(){
    if (curEl) markEl(curEl, false);
    markDock(false);
    if (playingAll) playAt(curIdx + 1);
  });

  audio.addEventListener('timeupdate', function(){
    var d = audio.duration || 0;
    var c = audio.currentTime || 0;
    fill.style.width = d ? (c / d * 100) + '%' : '0%';
    dockTime.textContent = fmt(c) + ' / ' + fmt(d);
  });

  audio.addEventListener('pause', function(){ markDock(false); });
  audio.addEventListener('play', function(){ markDock(true); });

  // dock 按钮
  dockBtn.addEventListener('click', function(){
    if (audio.paused) audio.play(); else audio.pause();
  });

  // dock 关闭
  document.getElementById('dockClose').addEventListener('click', function(){
    audio.pause();
    dock.classList.remove('up');
    stopAll();
    if (curEl) markEl(curEl, false);
  });

  // 进度条跳转
  seek.addEventListener('click', function(e){
    var r = seek.getBoundingClientRect();
    var p = (e.clientX - r.left) / r.width;
    if (audio.duration) audio.currentTime = p * audio.duration;
  });

  // 全部播放
  playAllBtn.addEventListener('click', function(){
    if (playingAll){
      stopAll();
      audio.pause();
      if (curEl) markEl(curEl, false);
      return;
    }
    playingAll = true;
    playAllBtn.classList.add('on');
    playAllBtn.querySelector('span').textContent = '停止';
    playAllBtn.querySelector('svg').innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';

    // 从第一条未播的开始
    var start = 0;
    for (var i = 0; i < DATA.length; i++){ if (!playedSet.has(i)){ start = i; break; } }
    playAt(start);
  });

  // 加载数据
  fetch('data.json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      DATA = d;
      render();
    })
    .catch(function(e){
      document.getElementById('list').innerHTML =
        '<div style="text-align:center;color:#7f7f8b;padding:40px 0">加载失败：' + e.message + '</div>';
    });
})();
</script>
</body>
</html>
